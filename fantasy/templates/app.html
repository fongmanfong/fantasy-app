<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#eff2ee; --surface:#ffffff; --surface-2:#f7f9f6;
  --ink:#131a16; --ink-2:#3c4a43; --muted:#61706a;
  --rule:#d5ddd6; --rule-strong:#b9c4bc;
  --accent:#146b45; --accent-ink:#ffffff;
  --good:#2f8f5b; --bad:#c05a3e;
  --chip:#e4eae4; --chip-ink:#3c4a43;
  --warn:#8a6d1f;
  --tint-max:34%;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1411; --surface:#161e19; --surface-2:#1b241e;
    --ink:#e7ede9; --ink-2:#b3c0b8; --muted:#8b9a92;
    --rule:#2a352e; --rule-strong:#3a473f;
    --accent:#3fa876; --accent-ink:#08140d;
    --good:#3fa876; --bad:#d4735a;
    --chip:#232d27; --chip-ink:#b3c0b8;
    --warn:#c9a444; --tint-max:42%;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1411; --surface:#161e19; --surface-2:#1b241e;
  --ink:#e7ede9; --ink-2:#b3c0b8; --muted:#8b9a92;
  --rule:#2a352e; --rule-strong:#3a473f;
  --accent:#3fa876; --accent-ink:#08140d;
  --good:#3fa876; --bad:#d4735a;
  --chip:#232d27; --chip-ink:#b3c0b8;
  --warn:#c9a444; --tint-max:42%;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;padding:26px 20px 70px}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:clamp(30px,4.6vw,44px);line-height:.96;margin:2px 0 0;letter-spacing:-.01em}

.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;
  padding-bottom:14px;border-bottom:2px solid var(--rule-strong)}
.ident{flex:1 1 300px;min-width:0}
.facts{display:flex;gap:24px;flex-wrap:wrap}
.fact{display:flex;flex-direction:column}
.fact .k{font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.fact .v small{font-size:12.5px;font-weight:500;color:var(--muted)}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
nav.tabs button{font-family:"Barlow Condensed",sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:9px 18px;border:0;
  background:transparent;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;
  justify-content:space-between}
.pickers{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label.field{display:flex;align-items:center;gap:7px;font-family:"Barlow Condensed",sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
select{font-family:"Barlow",sans-serif;font-size:14px;font-weight:500;
  padding:6px 9px;border:1px solid var(--rule-strong);border-radius:2px;
  background:var(--surface);color:var(--ink);min-width:0;max-width:230px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.legend{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.ramp{display:flex;height:11px;width:120px;border:1px solid var(--rule)}
.ramp i{flex:1}

.strip{background:var(--surface);border:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(9,1fr)}
.strip .cell{padding:9px 6px;text-align:center;border-left:1px solid var(--rule)}
.strip .cell:first-child{border-left:0}
.strip .lbl{font-family:"Barlow Condensed",sans-serif;font-size:11.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.strip .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.strip .rank{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip .bar-wrap{height:4px;background:var(--rule);margin-top:6px}
.strip .bar-fill{height:100%}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);
  font-family:"Barlow Condensed",sans-serif;font-size:12.5px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);
  padding:10px 9px;border-bottom:2px solid var(--rule-strong);white-space:nowrap;
  cursor:pointer;user-select:none;text-align:right}
thead th:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
thead th .arrow{color:var(--accent);font-size:10px;margin-left:3px}
th.player-col,td.player-col{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
thead th.player-col{background:var(--surface-2);z-index:3}
tbody tr:nth-child(even) td,tbody tr:nth-child(even) td.player-col{background:var(--surface-2)}
tbody tr:hover td{background:var(--chip)}
td{padding:0;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
td .pad{padding:9px}
td.num{text-align:right;font-weight:600}
.pname{font-weight:600;font-size:15px;white-space:nowrap}
.pmeta{display:flex;align-items:center;gap:7px;margin-top:2px}
.chip{font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;background:var(--chip);color:var(--chip-ink);
  padding:1px 6px;border-radius:2px}
.chip.bench{opacity:.7}
.chip.il{background:var(--bad);color:#fff;opacity:.9}
.chip.mine{background:var(--accent);color:var(--accent-ink)}
.nba{font-size:12px;color:var(--muted);letter-spacing:.05em}
.gtd{font-size:11px;color:var(--warn);font-weight:600;letter-spacing:.06em}
.small-sample{color:var(--warn);font-weight:700;cursor:help}
.rankpill{display:inline-block;min-width:22px;font-size:12px;font-weight:600;
  padding:1px 5px;border-radius:2px;background:var(--chip);color:var(--chip-ink)}

/* compare */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:0;
  background:var(--surface);border:1px solid var(--rule)}
.cmp .row{display:contents}
.cmp .c{padding:11px 14px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.cmp .c.lbl{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;font-size:12.5px;color:var(--muted);
  background:var(--surface-2);min-width:78px}
.cmp .c.a{text-align:right}
.cmp .c.b{text-align:left}
.cmp .c.win{font-weight:700;color:var(--good)}
.cmp .c.lose{color:var(--muted)}
.cmp .head{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;
  letter-spacing:.02em;background:var(--surface-2);border-bottom:2px solid var(--rule-strong)}
.cmp .score{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

.note{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);
  padding:1px 5px;border-radius:2px}
.note b{color:var(--ink-2)}
.err{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);
  padding:12px 14px;color:var(--ink)}
.loading{padding:26px;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div class="wrap">
  <header class="masthead">
    <div class="ident">
      <div class="eyebrow" id="league-line">loading…</div>
      <h1 id="title">Fantasy</h1>
    </div>
    <div class="facts" id="facts"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="roster" aria-selected="true">Roster</button>
    <button role="tab" data-view="standings" aria-selected="false">Standings</button>
    <button role="tab" data-view="free-agents" aria-selected="false">Free agents</button>
    <button role="tab" data-view="compare" aria-selected="false">Compare</button>
  </nav>

  <div class="controls">
    <div class="pickers">
      <label class="field" id="w-team">Team
        <select id="sel-team"></select></label>
      <label class="field" id="w-a">Team A
        <select id="sel-a"></select></label>
      <label class="field" id="w-b">Team B
        <select id="sel-b"></select></label>
      <label class="field" id="w-pos">Position
        <select id="sel-pos"></select></label>
      <label class="field">Period
        <select id="sel-period"></select></label>
    </div>
    <div class="legend" id="legend">
      <span>Weaker</span><span class="ramp" id="ramp" aria-hidden="true"></span>
      <span>Stronger</span><span id="pool-line"></span>
    </div>
  </div>

  <div id="content"><div class="loading">Loading…</div></div>

  <div class="note">
    <div id="note-body"></div>
    <div id="legacy-warn" hidden></div>
    <div id="prov"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let META = null, VIEW = "roster";

const api = async (path, params = {}) => {
  const qs = new URLSearchParams({...params, period: $("#sel-period").value});
  const r = await fetch(`${path}?${qs}`);
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
};

const ordinal = n => {
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};
const fmt = (v, cat) => v == null ? "—"
  : cat.rate ? v.toFixed(3).replace(/^0/, "") : v.toFixed(1);

// 0.5 is neutral; distance from the median sets strength, so an average player
// shows no colour at all.
function tint(p){
  if (p == null) return "transparent";
  const away = Math.abs(p - 0.5) * 2;
  const hue = p >= 0.5 ? "var(--good)" : "var(--bad)";
  return `color-mix(in srgb, ${hue} calc(${away.toFixed(3)} * var(--tint-max)), transparent)`;
}

function playerCell(p, opts = {}){
  const cls = p.pos === "IL" ? "chip il" : p.pos === "BN" ? "chip bench" : "chip";
  const slot = opts.hideSlot ? "" : `<span class="${cls}">${p.pos ?? "FA"}</span>`;
  const gtd = p.status && p.status !== "Healthy"
    ? `<span class="gtd">${p.status}</span>` : "";
  return `<div class="pad"><div class="pname">${p.name}</div>
    <div class="pmeta">${slot}<span class="nba">${p.nba ?? ""}</span>${gtd}</div></div>`;
}

// --- sortable player table, shared by Roster and Free agents ---
let sortKey = "pts", sortDir = -1;

function playerTable(players, opts = {}){
  const cats = META.categories;
  const sorted = [...players].sort((a, b) => sortKey === "name"
    ? a.name.localeCompare(b.name) * sortDir
    : ((a[sortKey] ?? -Infinity) - (b[sortKey] ?? -Infinity)) * sortDir);

  const wrap = document.createElement("div");
  wrap.className = "tablewrap";
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const tr = document.createElement("tr");

  const mk = (lbl, key, cls) => {
    const th = document.createElement("th");
    th.className = cls; th.tabIndex = 0; th.textContent = lbl;
    if (key === sortKey){
      const a = document.createElement("span");
      a.className = "arrow"; a.textContent = sortDir === -1 ? "▼" : "▲";
      th.appendChild(a);
    }
    const go = () => {
      if (sortKey === key) sortDir = -sortDir;
      else { sortKey = key; sortDir = key === "name" ? 1 : -1; }
      render();
    };
    th.addEventListener("click", go);
    th.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); }
    });
    tr.appendChild(th);
  };
  mk("Player", "name", "player-col");
  mk("GP", "gp", "num");
  cats.forEach(c => mk(c.label, c.key, "num"));
  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (const p of sorted){
    const row = document.createElement("tr");
    const pc = document.createElement("td");
    pc.className = "player-col";
    pc.innerHTML = playerCell(p, opts);
    row.appendChild(pc);

    const gp = document.createElement("td");
    gp.className = "num";
    gp.innerHTML = `<div class="pad">${p.gp}${p.gp < 20
      ? ' <span class="small-sample" title="Under 20 games — a per-game rate here is noise">△</span>' : ""}</div>`;
    row.appendChild(gp);

    for (const c of cats){
      const td = document.createElement("td");
      td.className = "num";
      td.style.background = tint(p[c.key + "_p"]);
      td.innerHTML = `<div class="pad">${fmt(p[c.key], c)}</div>`;
      row.appendChild(td);
    }
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function strengthStrip(players){
  const active = players.filter(p => p.pos !== "IL");
  const el = document.createElement("div");
  el.className = "strip";
  for (const c of META.categories){
    const vals = active.map(p => p[c.key + "_p"]).filter(v => v != null);
    const mean = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
    const pc = Math.round(mean * 100), d = pc - 50;
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<div class="lbl">${c.label}</div><div class="val">${pc}</div>
      <div class="rank">${d === 0 ? "at avg" : (d > 0 ? "+" : "−") + Math.abs(d) + " vs avg"}</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${pc}%;
        background:${mean >= 0.5 ? "var(--good)" : "var(--bad)"}"></div></div>`;
    el.appendChild(cell);
  }
  return el;
}

// --- views ---
const VIEWS = {
  async roster(box){
    const d = await api("/api/roster", {team: $("#sel-team").value});
    $("#pool-line").textContent = ` vs. ${d.pool} rostered players`;
    box.appendChild(strengthStrip(d.players));
    box.appendChild(playerTable(d.players));
    $("#note-body").innerHTML = "<b>Shading</b> is each player's percentile among " +
      "every rostered player in the league. <b>Turnovers are inverted</b> — fewer " +
      "is better, so green means low. <b>△</b> marks under 20 games, where a " +
      "per-game rate is noise.";
  },

  async standings(box){
    const d = await api("/api/standings");
    $("#pool-line").textContent = "";
    const wrap = document.createElement("div");
    wrap.className = "tablewrap";
    const cats = d.categories;
    const rows = [...d.teams].sort((a, b) =>
      (a.standing ?? 99) - (b.standing ?? 99));

    wrap.innerHTML = `<table><thead><tr>
      <th class="player-col">Team</th><th>W–L</th>
      ${cats.map(c => `<th>${c.label}</th>`).join("")}
      <th>Mean rk</th></tr></thead><tbody>
      ${rows.map(t => `<tr>
        <td class="player-col"><div class="pad">
          <div class="pname">${t.name}</div>
          <div class="pmeta">${t.is_my_team ? '<span class="chip mine">Mine</span>' : ""}
          <span class="nba">${t.manager ?? ""}</span></div></div></td>
        <td class="num"><div class="pad">${t.wins}–${t.losses}</div></td>
        ${cats.map(c => {
          const rk = t.ranks[c.key], n = rows.length;
          const p = rk ? 1 - (rk - 1) / (n - 1) : null;
          return `<td class="num" style="background:${tint(p)}"><div class="pad">
            ${fmt(t.totals[c.key], c)}
            <span class="rankpill">${rk ?? "—"}</span></div></td>`;
        }).join("")}
        <td class="num"><div class="pad">${t.mean_rank ?? "—"}</div></td>
      </tr>`).join("")}</tbody></table>`;
    box.appendChild(wrap);
    $("#note-body").innerHTML = "Category values are the team's <b>weekly output</b> " +
      "— per-game rates summed across active players, with FG% and FT% weighted by " +
      "real makes and attempts. The small number is that team's rank in the category; " +
      "shading follows the rank. <b>IL players are excluded.</b>";
  },

  async ["free-agents"](box){
    const d = await api("/api/free-agents");
    $("#pool-line").textContent = ` vs. ${d.pool} rostered players`;
    fillPositions(d.players);
    const pos = $("#sel-pos").value || "ALL";
    const shown = pos === "ALL" ? d.players
      : d.players.filter(p => (p.positions || []).includes(pos));
    box.appendChild(playerTable(shown, {hideSlot: true}));
    $("#note-body").innerHTML = `<b>${shown.length}</b> available players, ranked ` +
      "against <b>rostered</b> players rather than against each other — so green " +
      "here means genuinely startable, not just best-of-the-leftovers.";
  },

  async compare(box){
    const a = $("#sel-a").value, b = $("#sel-b").value;
    if (a === b){
      box.innerHTML = '<div class="err">Pick two different teams to compare.</div>';
      return;
    }
    const d = await api("/api/compare", {a, b});
    $("#pool-line").textContent = "";
    const el = document.createElement("div");
    el.className = "cmp";
    el.innerHTML = `
      <div class="c a head">${d.a.name}</div>
      <div class="c lbl head">${d.score.a}–${d.score.b}</div>
      <div class="c b head">${d.b.name}</div>
      ${d.categories.map(c => `
        <div class="c a ${c.edge === "a" ? "win" : "lose"}">${fmt(c.a, c)}</div>
        <div class="c lbl">${c.label}</div>
        <div class="c b ${c.edge === "b" ? "win" : "lose"}">${fmt(c.b, c)}</div>`).join("")}`;
    box.appendChild(el);
    const winner = d.score.a === d.score.b ? "Dead even"
      : (d.score.a > d.score.b ? d.a.name : d.b.name) + " takes it";
    $("#note-body").innerHTML = `<b>${winner}, ${Math.max(d.score.a, d.score.b)}–` +
      `${Math.min(d.score.a, d.score.b)}.</b> Weekly output from active players only ` +
      `(${d.a.players} vs ${d.b.players}), percentages weighted by real makes and ` +
      "attempts. Turnovers count for the team with fewer.";
  },
};

// Options come from the players actually available, so the list never offers a
// slot with nothing behind it.
function fillPositions(players){
  const sel = $("#sel-pos");
  const seen = [...new Set(players.flatMap(p => p.positions || []))].sort();
  const wanted = ["ALL", ...seen].join("|");
  if (sel.dataset.built === wanted) return;
  const keep = sel.value;
  sel.innerHTML = '<option value="ALL">All</option>' +
    seen.map(p => `<option value="${p}">${p}</option>`).join("");
  sel.dataset.built = wanted;
  if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
}

function syncControls(){
  const show = (id, on) => $(id).hidden = !on;
  show("#w-team", VIEW === "roster");
  show("#w-a", VIEW === "compare");
  show("#w-b", VIEW === "compare");
  show("#w-pos", VIEW === "free-agents");
  $("#legend").hidden = VIEW === "compare";
}

async function render(){
  syncControls();
  const box = $("#content");
  box.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const fresh = document.createElement("div");
    fresh.style.display = "flex";
    fresh.style.flexDirection = "column";
    fresh.style.gap = "20px";
    await VIEWS[VIEW](fresh);
    box.innerHTML = "";
    box.appendChild(fresh);
  } catch (e){
    box.innerHTML = `<div class="err"><b>Could not load.</b> ${e.message}</div>`;
  }
}

async function boot(){
  META = await (await fetch("/api/meta")).json();
  const L = META.league;
  document.title = L.name;
  $("#league-line").textContent =
    `${L.season} · ${L.teams}-team · ${L.scoring_type === "head" ? "head-to-head" : L.scoring_type}`;
  $("#title").textContent = L.name;

  const mine = META.teams.find(t => t.is_my_team);
  $("#facts").innerHTML = `
    <div class="fact"><span class="k">My team</span><span class="v">${mine ? mine.name : "—"}</span></div>
    <div class="fact"><span class="k">Standing</span><span class="v">${
      mine && mine.standing ? ordinal(mine.standing) + ` <small>of ${L.teams}</small>` : "—"}</span></div>
    <div class="fact"><span class="k">Cat record</span><span class="v">${
      mine ? `${mine.wins}–${mine.losses}` : "—"}</span></div>`;

  const opts = META.teams.map(t =>
    `<option value="${t.team_key}">${t.name}${t.is_my_team ? " (mine)" : ""}</option>`).join("");
  $("#sel-team").innerHTML = opts;
  $("#sel-a").innerHTML = opts;
  $("#sel-b").innerHTML = opts;
  if (mine){ $("#sel-team").value = mine.team_key; $("#sel-a").value = mine.team_key; }
  const other = META.teams.find(t => !t.is_my_team);
  if (other) $("#sel-b").value = other.team_key;

  $("#sel-period").innerHTML = META.periods
    .map(p => `<option value="${p}">${p.replace("_", " ")}</option>`).join("");
  $("#sel-period").value = META.periods.includes("season") ? "season" : META.periods[0];

  const ramp = $("#ramp");
  for (let i = 0; i < 12; i++){
    const s = document.createElement("i");
    s.style.background = tint(i / 11);
    ramp.appendChild(s);
  }

  if (META.legacy_names){
    const w = $("#legacy-warn");
    w.hidden = false;
    w.innerHTML = "<b>Note:</b> this snapshot predates the stat-map fix, so made " +
      "threes are read from the reversed label. Values are correct; a fresh " +
      "<code>fantasy pull</code> removes the workaround.";
  }
  $("#prov").innerHTML = `Pull #${META.pull.id} · ` +
    `${new Date(META.pull.at).toLocaleString()} · <code>fantasy view</code>`;

  document.querySelectorAll("nav.tabs button").forEach(b =>
    b.addEventListener("click", () => {
      VIEW = b.dataset.view;
      document.querySelectorAll("nav.tabs button").forEach(x =>
        x.setAttribute("aria-selected", String(x === b)));
      sortKey = "pts"; sortDir = -1;
      render();
    }));
  ["#sel-team", "#sel-a", "#sel-b", "#sel-period", "#sel-pos"].forEach(s =>
    $(s).addEventListener("change", render));

  render();
}
boot().catch(e => {
  $("#content").innerHTML = `<div class="err"><b>Could not start.</b> ${e.message}</div>`;
});
</script>
</body></html>
