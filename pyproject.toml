[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy"
version = "0.1.0"
description = "Pull a Yahoo Fantasy NBA league's state into DuckDB from the command line"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "requests>=2.31",
    "requests-oauthlib>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
fantasy = "fantasy.cli:app"

[tool.setuptools.packages.find]
include = ["fantasy*"]

[tool.setuptools.package-data]
"fantasy.store" = ["*.sql"]
"fantasy.templates" = ["*.html"]
